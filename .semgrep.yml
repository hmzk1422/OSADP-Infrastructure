rules:
  - id: rust-production-panic
    languages: [rust]
    severity: ERROR
    message: "Avoid panic paths in production code; return an error instead."
    patterns:
      - pattern-either:
          - pattern: panic!(...)
          - pattern: unreachable!(...)
      - pattern-not-inside: |
          #[cfg(test)]
          mod tests {
            ...
          }
    paths:
      include:
        - "/uets/**/*.rs"
        - "/components/pipelines/**/*.rs"

  - id: rust-production-unwrap-expect
    languages: [rust]
    severity: ERROR
    message: "Avoid unwrap()/expect() in production paths; handle the error explicitly."
    patterns:
      - pattern-either:
          - pattern: $VALUE.unwrap()
          - pattern: $VALUE.expect(...)
      - pattern-not-inside: |
          #[cfg(test)]
          mod tests {
            ...
          }
    paths:
      include:
        - "/uets/**/*.rs"
        - "/components/pipelines/**/*.rs"

  - id: rust-nested-mutex-lock
    languages: [rust]
    severity: ERROR
    message: "Nested mutex acquisition can deadlock; avoid holding one lock while acquiring another."
    patterns:
      - pattern: $FIRST.lock()...$SECOND.lock()
      - metavariable-comparison:
          metavariable: $FIRST
          comparison: $FIRST != $SECOND
    paths:
      include:
        - "/uets/**/*.rs"
        - "/components/pipelines/**/*.rs"

  - id: rust-mutex-guard-across-await
    languages: [rust]
    severity: ERROR
    message: "Do not hold a synchronous mutex guard across await; it can stall tasks or deadlock."
    patterns:
      - pattern: |
          let $GUARD = $LOCK.lock()...;
          ...
          $FUTURE.await
    paths:
      include:
        - "/uets/**/*.rs"
        - "/components/pipelines/**/*.rs"

  - id: rust-risky-float-division
    languages: [rust]
    severity: WARNING
    message: "Review division by a price, quantity, equity, or exposure value for zero and finite-value guards."
    patterns:
      - pattern: $NUMERATOR / $DENOMINATOR
      - metavariable-regex:
          metavariable: $DENOMINATOR
          regex: "(?i).*(equity|price|qty|quantity|capital|notional|exposure|leverage|tick|mark).*"
    paths:
      include:
        - "/uets/**/*.rs"
        - "/components/pipelines/**/*.rs"

  - id: python-bare-except
    languages: [python]
    severity: ERROR
    message: "Avoid bare except clauses that can swallow process interrupts."
    pattern: |
      try:
        ...
      except:
        ...
    paths:
      include:
        - "/uets/**/*.py"
        - "/components/**/*.py"

  - id: python-risky-division
    languages: [python]
    severity: WARNING
    message: "Review division by a risk-sensitive value for zero and finite-value guards."
    patterns:
      - pattern-either:
          - pattern: $NUMERATOR / $DENOMINATOR
          - pattern: $NUMERATOR // $DENOMINATOR
      - metavariable-regex:
          metavariable: $DENOMINATOR
          regex: "(?i).*(equity|price|qty|quantity|capital|notional|exposure|leverage).*"
    paths:
      include:
        - "/uets/**/*.py"
        - "/components/**/*.py"
