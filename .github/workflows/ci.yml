# =============================================================================
# OSADP-Core — Continuous Integration / Delivery
# =============================================================================
# Matrix build for the hybrid Python/Rust stack using `maturin-action`:
#   * Linux  (x86_64 + aarch64) — Oracle Cloud, Android proot distros, edge servers
#   * Windows (x86_64)          — local development machines
#
# Jobs:
#   rust    — compile + unit-test the entire Rust workspace on Linux & Windows
#   wheels  — build native wheels with maturin-action, upload as artifacts
#   smoke   — install the Linux wheel, validate the unified_runner CLI
#   release — publish wheels to PyPI on version tags (trusted publishing)
#
# NOTE: the `wheels` job compiles `unified-execution/engine` into a Python
# module. The crate must expose a PyO3 `#[pymodule]` (see pyproject.toml);
# the `rust` job validates the workspace independently of that binding.
# =============================================================================

name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

  wheels:
    name: Wheels (${{ matrix.platform.label }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { label: linux-x86_64,  os: ubuntu-24.04, target: x86_64,  manylinux: auto }
          - { label: linux-aarch64, os: ubuntu-24.04, target: aarch64, manylinux: auto }
          - { label: windows-x86_64, os: windows-2025, target: x86_64,  manylinux: "" }
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: true
          manylinux: ${{ matrix.platform.manylinux }}

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.platform.label }}
          path: dist

  smoke:
    name: Smoke test (unified_runner)
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download Linux x86_64 wheel
        uses: actions/download-artifact@v6
        with:
          name: wheels-linux-x86_64
          path: dist

      - name: Install wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Validate unified runner
        run: |
          python unified_runner.py --help
          python unified_runner.py doctor --require-native

  release:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheels
    permissions:
      id-token: write   # trusted publishing
      contents: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all wheels
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
