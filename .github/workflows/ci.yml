name: UETS CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uets-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86:
    name: Linux x86_64 - UETS and Components
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile UETS and all workspace components
        run: cargo check --workspace --all-targets

      - name: Run UETS and component tests
        run: cargo test --workspace

      - name: Verify mocked order routing and simulation edge cases
        run: cargo test -p uets_manager adapter_preserves_reduce_only_on_exit_orders

      - name: Verify market fills and risk rejection paths
        run: |
          cargo test -p uets_trades market_order_fills_at_mark_with_slippage_and_fees
          cargo test -p uets_trades insufficient_cash_rejects_with_state_update

      - name: Run playback end-to-end smoke tests
        run: python tests/test_playback_runner.py

      - name: Run Clippy on UETS and all workspace components
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious

      - name: Build and package Linux UETS executable
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            amazonlinux:2023 \
            bash -euc '
              dnf install -y gcc gcc-c++ clang cmake make openssl-devel pkgconf-pkg-config perl python3 python3-devel tar gzip git
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              source "$HOME/.cargo/env"
              export CARGO_TARGET_DIR=/tmp/uets-target
              cargo build --locked --release --package uets --bin dev_test
              mkdir -p dist/uets-linux-x86_64/bin dist/uets-linux-x86_64/uets/config dist/uets-linux-x86_64/uets/models/ofmr
              install "$CARGO_TARGET_DIR/release/dev_test" dist/uets-linux-x86_64/bin/uets
              sed "s/^mode: playback/mode: live-test/" uets/config/execution.yaml > dist/uets-linux-x86_64/uets/config/execution.yaml
              grep -q "^mode: live-test" dist/uets-linux-x86_64/uets/config/execution.yaml
              install uets/config/ofmr.yaml dist/uets-linux-x86_64/uets/config/ofmr.yaml
              install uets/models/ofmr/trader.txt dist/uets-linux-x86_64/uets/models/ofmr/trader.txt
              tar -czf dist/uets-linux-x86_64.tar.gz -C dist uets-linux-x86_64
              cd dist/uets-linux-x86_64
              ./bin/uets strategies ofmr
            '

      - name: Upload Linux UETS bundle
        uses: actions/upload-artifact@v4
        with:
          name: uets-linux-x86_64-amazonlinux2023
          path: dist/uets-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Reclaim build space before Semgrep
        run: |
          cargo clean
          python -m pip cache purge

      - name: Install Semgrep
        run: python -m pip install --no-cache-dir semgrep

      - name: Run UETS static-analysis rules
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            baseline="origin/$BASE_REF"
          else
            baseline="$BEFORE_SHA"
          fi
          if [ -z "$baseline" ] || [ "$baseline" = "0000000000000000000000000000000000000000" ]; then
            baseline="HEAD^"
          fi
          semgrep scan --config .semgrep.yml --baseline-commit "$baseline" --error --metrics=off

  bybit-testnet-orders:
    name: Bybit testnet order acceptance (manual)
    if: github.event_name == 'workflow_dispatch' && vars.UETS_BYBIT_TESTNET_SMOKE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Submit and verify testnet orders
        env:
          UETS_BYBIT_TESTNET_API_KEY: ${{ secrets.UETS_BYBIT_TESTNET_API_KEY }}
          UETS_BYBIT_TESTNET_API_SECRET: ${{ secrets.UETS_BYBIT_TESTNET_API_SECRET }}
          UETS_BYBIT_TESTNET_SYMBOL: ${{ vars.UETS_BYBIT_TESTNET_SYMBOL }}
          UETS_BYBIT_TESTNET_QTY: ${{ vars.UETS_BYBIT_TESTNET_QTY }}
          UETS_BYBIT_TESTNET_MAX_NOTIONAL_USDT: ${{ vars.UETS_BYBIT_TESTNET_MAX_NOTIONAL_USDT }}
          UETS_BYBIT_TESTNET_POSITION_MODE: ${{ vars.UETS_BYBIT_TESTNET_POSITION_MODE }}
          UETS_BYBIT_TESTNET_CONFIRM: YES
        run: python tests/bybit_testnet_order_smoke.py
