# =============================================================================
# OSADP-Core — Continuous Integration / Delivery
# =============================================================================
# Matrix build for the hybrid Python/Rust stack using `maturin-action`:
#   * Linux  (x86_64 + aarch64) — Oracle Cloud, Android proot distros, edge servers
#   * Windows (x86_64)          — local development machines
#
# Jobs:
#   rust        — compile + unit-test the entire Rust workspace on Linux & Windows
#   wheels      — build native wheels with maturin-action, upload as artifacts
#   docker      — build/push multi-arch runtime image to GHCR (Oracle/edge servers;
#                 NOT for Android/Termux — see docs/TERMUX.md)
#   smoke       — install the Linux wheel, validate the unified_runner CLI
#   smoke-arm64 — validate the aarch64 wheel under QEMU (Termux-proot / RPi path)
#   release     — publish wheels to PyPI on version tags (trusted publishing)
#
# NOTE: the `wheels` job compiles `unified-execution/engine` into a Python
# module. The crate must expose a PyO3 `#[pymodule]` (see pyproject.toml);
# the `rust` job validates the workspace independently of that binding.
# =============================================================================

name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

  wheels:
    name: Wheels (${{ matrix.platform.label }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { label: linux-x86_64,  os: ubuntu-24.04, target: x86_64,  manylinux: "2_28" }
          - { label: linux-aarch64, os: ubuntu-24.04, target: aarch64, manylinux: "2_28" }
          - { label: windows-x86_64, os: windows-2025, target: x86_64,  manylinux: "" }
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Only for local `act` runs: act executes the job inside a container, so
      # maturin-action skips its own manylinux image and builds on the "host"
      # (the job container), which ships without a Rust toolchain. On real
      # GitHub runners this step is skipped — maturin-action handles Rust there.
      - name: Install Rust (local act runs only)
        if: env.ACT
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: true
          manylinux: ${{ matrix.platform.manylinux }}
          # Runs INSIDE the maturin-action container before maturin/cargo.
          before-script-linux: |
            # 1) libclang for bindgen (librocksdb-sys regenerates bindings)
            if command -v yum &> /dev/null; then
              yum install -y clang-devel llvm-devel
            elif command -v apt-get &> /dev/null; then
              apt-get update && apt-get install -y libclang-dev
            fi
            # 2) librocksdb-sys 0.16 always runs bindgen, which otherwise
            #    parses RocksDB's c.h against HOST glibc headers and dies on
            #    'bits/libc-header-start.h not found' when cross-compiling.
            #    Point clang at the cross sysroot instead.
            if [ -d /usr/aarch64-unknown-linux-gnu ]; then
              SYSROOT=/usr/aarch64-unknown-linux-gnu
              [ -d "$SYSROOT/aarch64-unknown-linux-gnu/sysroot" ] && SYSROOT="$SYSROOT/aarch64-unknown-linux-gnu/sysroot"
              export BINDGEN_EXTRA_CLANG_ARGS="--target=aarch64-unknown-linux-gnu --sysroot=$SYSROOT -I/usr/aarch64-unknown-linux-gnu/include"
              echo "BINDGEN_EXTRA_CLANG_ARGS=$BINDGEN_EXTRA_CLANG_ARGS"
            fi

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.platform.label }}
          path: dist
          if-no-files-found: error

  docker:
    name: Build and Push Docker Image
    needs: wheels
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' # Only push on main branch merges
    permissions:
      contents: read
      packages: write # Allows pushing to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Linux x86_64 wheel
        uses: actions/download-artifact@v6
        with:
          name: wheels-linux-x86_64
          path: dist

      - name: Download Linux aarch64 wheel
        uses: actions/download-artifact@v6
        with:
          name: wheels-linux-aarch64
          path: dist

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for ARM emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Handles lowercasing repository names and tag formatting safely
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  smoke:
    name: Smoke test (unified_runner)
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download Linux x86_64 wheel
        uses: actions/download-artifact@v6
        with:
          name: wheels-linux-x86_64
          path: dist

      - name: Install wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Validate unified runner
        run: |
          python unified_runner.py --help
          python unified_runner.py doctor --require-native

  # Validates the exact artifact Termux-proot / Raspberry-Pi users install:
  # glibc linux/arm64 + pip wheel. Runs the runner under QEMU emulation.
  smoke-arm64:
    name: Smoke test (linux-aarch64 under QEMU)
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Linux aarch64 wheel
        uses: actions/download-artifact@v6
        with:
          name: wheels-linux-aarch64
          path: dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Validate wheel on emulated arm64
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/work -w /work python:3.11-slim bash -exc '
              pip install --no-cache-dir dist/*.whl
              python unified_runner.py --help
              python unified_runner.py doctor --require-native
            '

  release:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheels
    permissions:
      id-token: write   # trusted publishing
      contents: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all wheels
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1