[package]
name = "live-trade"
version = "0.1.0"
edition = "2024"

[dependencies]
engine = { path = "../engine" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rocksdb = { version = "0.22", default-features = false, features = ["snappy", "lz4"] }
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"