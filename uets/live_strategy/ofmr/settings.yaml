# OFMR live strategy settings.
# Values mirror config/portfolio.json `_strategy_defaults` and
# strategy_system/strategy/ofmr/config.py so the live Rust path matches
# research exactly. No serde_yaml dependency: these are read by `settings::load()`
# which hardcodes the defaults below and optionally overlays a YAML file.

model:
  path: "uets/models/ofmr/trader.txt"
  threshold: 0.20
  trade_direction: "long"

feature:
  rsi_14_window: 14
  rsi_2_window: 2
  sma_14_window: 14
  ma_slope_window: 5
  price_roc_window_3: 3
  price_roc_window_5: 5
  rsi_z_window: 20
  deeplob_z_window: 10
  orderflow_z_window: 10
  rsi_roc_window_3: 3
  rsi_roc_window_5: 5
  barrier_vol_bar_window: 20

trade:
  max_position_usd: 100.0
  min_order_size: 0.001
  stop_loss_bps: 5.0
  take_profit_bps: 5.0
  max_hold_seconds: 300
  lockout_seconds: 1000.0
  max_trades_per_hour: 300
