mode: paper # paper | testnet | live | playback
allow_live_trading: false

playback:
  method: purged_walk_forward # purged_walk_forward | parametric_monte_carlo | cpcv
  source: synthetic # synthetic | cryptol2; CPCV requires cryptol2
  max_abs_correlation: 0.5
  n_splits: 6
  n_test_splits: 2
  purge_bars: 0
  max_paths: 100000
  workers: 0 # 0 uses all available CPU cores
  starting_capital: 10000.0
  fee_bps: 4.0
  periods_per_year: 252.0

  synthetic:
    generator: synth2 # synth1 | synth2 | synth3
    paths: 32
    n_bars: 500
    seed: 84
    symbol: SYNTH
    bar_seconds: 1.0

  cryptol2:
    path_glob: market_data/ingest_parquet/{symbol}/merged/**/*.parquet
    all_assets_glob: market_data/ingest_parquet/*/merged/**/*.parquet
    symbols: [BTCUSDT]

  strategy:
    type: momentum
    lookback_bars: 5
    entry_threshold: 0.0

ofmr:
  model:
    path: uets/models/ofmr/trader.txt
    threshold: 0.50
    trade_direction: long
  feature:
    htf_timeframe_secs: 300
    ltf_timeframe_secs: 1
    rsi_14_window: 14
    rsi_2_window: 2
    sma_14_window: 14
    ma_slope_window: 5
    price_roc_window_3: 3
    price_roc_window_5: 5
    rsi_z_window: 20
    deeplob_z_window: 10
    orderflow_z_window: 10
    rsi_roc_window_3: 3
    rsi_roc_window_5: 5
    barrier_vol_bar_window: 20
  trade:
    max_position_usd: 10000.0
    min_order_size: 0.001
    stop_loss_bps: 5.0
    take_profit_bps: 5.0
    max_hold_seconds: 300
    lockout_seconds: 1000.0
    max_trades_per_hour: 300
