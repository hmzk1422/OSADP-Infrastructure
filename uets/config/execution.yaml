mode: playback # playback | live-test | testnet | live-trade
allow_live_trading: false
tickers: [] # pre-loaded strategy@asset tickers, e.g. ofmr@btcusdt, ofmr@ethusdt

playback:
  method: purged_walk_forward # purged_walk_forward | parametric_monte_carlo | cpcv
  source: cryptol2_offline # cryptol2_offline | cryptol2 | synthetic (Monte Carlo only)
  bar_seconds: 300.0 # aggregate event prices into 5-minute bars for validation
  max_abs_correlation: 0.5
  n_splits: 6
  n_test_splits: 2
  playback_strategies:
    - ofmr@pwf
    - ofmr@mc
    - ofmr@cpcv
  n_bootstrap: 500 # Monte Carlo bootstrap paths drawn from fitted distribution
  max_paths: 100000
  workers: 0 # 0 uses all available CPU cores
  starting_capital: 10000.0
  fee_bps: 0.0 # matches ml_state_optimized.py; set venue fees for net-of-fee playback
  periods_per_year: 252.0

  synthetic:
    generator: synth2 # synth1 | synth2 | synth3
    paths: 512
    n_bars: 500
    seed: 84
    symbol: SYNTH
    bar_seconds: 1.0

  cryptol2_offline:
    root: market_data/matched
    symbol: BTCUSDT
    path_glob: market_data/matched/{symbol}/merged_*.parquet
    state_space_path: strategy_system/strategy/ofmr/models/state_space_btcusdt_720files.parquet
    state_space_manifest: strategy_system/strategy/ofmr/models/manifest_btcusdt_720files.json
    walk_forward:
      model_catalog: build/walkforward_models/catalog.json

  cryptol2:
    root: market_data/ingest_parquet
    symbol: BTCUSDT
    path_glob: market_data/ingest_parquet/{symbol}/merged/**/*.parquet
    chunk_size: 10000 # bars per online chunk read

  strategy:
    type: ofmr # strategy folder under uets/live_strategy
    confidence_threshold: 0.25 # matches the OFMR research threshold table
    lookback_bars: 20
    entry_threshold: 0.001
