mode: playback # paper | testnet | live | playback
allow_live_trading: false

playback:
  method: purged_walk_forward # purged_walk_forward | parametric_monte_carlo | cpcv
  source: state_space # state_space | synthetic | cryptol2; CPCV requires cryptol2
  max_abs_correlation: 0.5
  n_splits: 6
  n_test_splits: 2
  purge_bars: 0
  max_paths: 100000
  workers: 0 # 0 uses all available CPU cores
  starting_capital: 10000.0
  fee_bps: 0.0 # per fill; entry and exit fees are charged separately
  periods_per_year: 252.0

  synthetic:
    generator: synth2 # synth1 | synth2 | synth3
    paths: 32
    n_bars: 500
    seed: 84
    symbol: SYNTH
    bar_seconds: 1.0

  cryptol2:
    path_glob: market_data/ingest_parquet/{symbol}/merged/**/*.parquet
    all_assets_glob: market_data/ingest_parquet/*/merged/**/*.parquet
    symbols: [BTCUSDT]
    walk_forward:
      model_catalog: build/walkforward_models/catalog.json # exported by the OFMR research walk-forward

  state_space:
    path: strategy_system/strategy/ofmr/models/state_space_btcusdt_720files.parquet
    walk_forward:
      model_catalog: build/walkforward_models/catalog.json

  strategy:
    type: ofmr # Rust OFMR playback over research features and purged fold models
