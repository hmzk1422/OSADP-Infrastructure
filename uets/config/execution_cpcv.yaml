allow_live_trading: false
mode: playback
playback:
  bar_seconds: 300.0
  cryptol2:
    chunk_size: 10000
    path_glob: market_data/ingest_parquet/{symbol}/merged/**/*.parquet
    root: market_data/ingest_parquet
    symbol: BTCUSDT
  cryptol2_offline:
    path_glob: market_data/matched/{symbol}/merged_*.parquet
    root: market_data/matched
    symbol: BTCUSDT
  fee_bps: 4.0
  max_abs_correlation: 0.5
  max_paths: 100000
  method: cpcv
  n_bootstrap: 500
  n_splits: 6
  n_test_splits: 2
  periods_per_year: 252.0
  purge_bars: 10
  source: cryptol2_offline
  starting_capital: 10000.0
  strategy:
    entry_threshold: 0.002
    lookback_bars: 50
    type: momentum
  synthetic:
    bar_seconds: 1.0
    generator: synth2
    n_bars: 500
    paths: 512
    seed: 84
    symbol: SYNTH
  workers: 0
