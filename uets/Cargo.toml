[package]
name = "uets"
version = "0.1.0"
edition = "2024"

[lib]
name = "uets"
path = "executor/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
# Opt-in only: maturin enables this automatically when building the Python
# extension module. It must stay OFF for `cargo run --bin dev_test` -- an
# rlib built with extension-module cannot be linked into an executable
# (the Python C symbols would be unresolved at link time).
extension-module = ["pyo3/extension-module"]

[dependencies]
binance = "0.21"
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
# The live canonical-row engine: turns typed market events into the merged
# 128-column table. It is std-only, so this adds no transitive weight; the
# point of the path dependency is that `executor` and the merger cannot drift
# apart on schema.
event_merger_live = { path = "../components/pipelines/event_merger/live" }
pyo3 = "0.29"
# Same major as what the `binance` crate pulls in (see Cargo.lock: 0.21.0) so
# both resolve to one build. No TLS feature: tungstenite 0.21 enables
# native-tls by default and the binance crate uses the vendored variant.
tungstenite = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rocksdb = { version = "0.22", default-features = false, features = ["lz4"] }
uets_db = { path = "../components/pipelines/uets_db" }
uets_gui = { path = "../components/pipelines/uets_gui" }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "dev_test"
path = "executor/executor.rs"
