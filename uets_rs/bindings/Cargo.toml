[package]
name = "engine-bindings"
version = "0.1.0"
edition = "2024"
description = "PyO3 bindings exposing the Rust strategy engine as the Python module 'engine'"

[lib]
name = "engine_bindings"
crate-type = ["cdylib", "rlib"]

[features]
# Maturin builds with `--features python` (see pyproject.toml [tool.maturin]).
# Without it the crate compiles empty so `cargo test --workspace` never needs
# a Python interpreter.
default = []
python = ["dep:pyo3", "pyo3/extension-module", "pyo3/abi3-py38"]

[dependencies]
engine = { path = "../engine" }
live-trade = { path = "../live-trade" }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
serde_json = "1"
pyo3 = { version = "0.29", optional = true, features = ["abi3-py38"] }
