[package]
name = "intraday-momentum-composite"
version = "0.1.0"
edition = "2024"

# ------------------------------------------------------------------
# Rust Executor — the production strategy engine.
#
# Receives live trades + orderbook from the Python CCXT sidecar
# (tools/ccxt_sidecar.py), computes the same 15 features as
# research/feature_builder.py, runs ONNX model inference, and
# executes barrier-driven short/long entries.
#
# Build & run:
#   cargo run                     # reads config.toml, spawns sidecar
#   python tools/export_onnx.py   # (re-)export the ONNX model
# ------------------------------------------------------------------

[[bin]]
name = "executor"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["clock"] }
ndarray = "0.17"
ort = { version = "2.0.0-rc.13", features = ["ndarray"] }
