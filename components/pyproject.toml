[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "lob_builder"
version = "0.1.0"

[tool.maturin]
bindings = "pyo3"
# Explicit (not left to maturin's defaults) so `maturin develop` builds a
# loadable .pyd; plain `cargo build` in this directory omits the feature.
features = ["extension-module"]