[package]
name = "parity"
version = "0.0.0"
edition = "2021"

# The parity harness lives in the toolkit (per the plan) but exercises the
# real executor sources, so a drift between Python and Rust is caught here.
# `ml_feature` is pulled in by path because `uets/executor/lib.rs` is outside
# the allowed edit scope and does not declare the module.
[dependencies]
serde_json = "1"

[[bin]]
name = "parity"
path = "parity.rs"

[lib]
name = "parity"
path = "lib.rs"
