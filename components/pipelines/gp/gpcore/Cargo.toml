[package]
name = "gpcore"
version = "0.1.0"
edition = "2021"

[lib]
name = "gpcore"
crate-type = ["cdylib", "rlib"]
path = "../lib.rs"

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
numpy = "0.22"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[package.metadata.maturin]
python-source = "python"
